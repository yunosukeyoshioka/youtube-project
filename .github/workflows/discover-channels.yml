name: Discover Channels

# Manual trigger -- tap "Run workflow" from the GitHub mobile app (Actions
# tab -> Discover Channels -> Run workflow) to have the channel strategist
# analyze the competitive landscape and propose new channel concepts from
# your phone. Proposals land as a pull request (channels/*.yaml) for you to
# review and merge with one tap -- nothing is added to your repo directly.
on:
  workflow_dispatch:
    inputs:
      interest:
        description: "Broad interest area, e.g. 'cooking' or 'personal finance' (leave blank for general trending analysis)"
        required: false
      count:
        description: "How many channel concepts to propose"
        default: "3"

permissions:
  contents: write
  pull-requests: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: pip install -e .

      - name: Propose channel concepts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INTEREST: ${{ inputs.interest }}
        run: |
          ARGS=(discover-channels --count "${{ inputs.count }}" --save)
          [ -n "$INTEREST" ] && ARGS+=(--interest "$INTEREST")
          youtube-automation "${ARGS[@]}"

      - name: Open a PR with the proposed channels
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Add proposed channel concepts"
          branch: channel-proposals/${{ github.run_id }}
          title: "New channel concepts to review"
          body: |
            Auto-generated by `youtube-automation discover-channels`.

            Review each `channels/*.yaml` below, tweak the niche/tone/name as
            you like, then merge. Once merged, run a channel with:

            ```
            youtube-automation --channel <slug> create
            ```
          add-paths: channels/*.yaml
